{{- include "spike.validate" . }}
{{- $name := .Values.secrets.name }}
{{- /* Keep the generated key of OpenSandbox on an upgrade: a new key would lock the gateway out for a moment. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $stored := dict }}
{{- if and $existing $existing.data }}
{{- $stored = $existing.data }}
{{- end }}
{{- $sandboxKey := .Values.secrets.sandboxApiKey }}
{{- if not $sandboxKey }}
{{- if index $stored "sandbox-api-key" }}
{{- $sandboxKey = index $stored "sandbox-api-key" | b64dec }}
{{- else }}
{{- $sandboxKey = randAlphaNum 40 }}
{{- end }}
{{- end }}
{{- /* An upgrade without the model key keeps the stored key, so a later change of another value does not remove it. */}}
{{- $llmKey := .Values.secrets.llmApiKey }}
{{- if and (not $llmKey) (index $stored "llm-api-key") }}
{{- $llmKey = index $stored "llm-api-key" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spike.labels" . | nindent 4 }}
type: Opaque
stringData:
  s3-access-key-id: {{ .Values.secrets.s3AccessKeyId | quote }}
  s3-secret-access-key: {{ .Values.secrets.s3SecretAccessKey | quote }}
  llm-api-key: {{ $llmKey | quote }}
  sandbox-api-key: {{ $sandboxKey | quote }}
